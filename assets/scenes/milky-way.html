<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'"><title>ASCII milky-way</title><script src="settings.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#25303b}canvas{position:absolute;inset:0;width:100%;height:100%}.viz-controls,.viz-row,.sr-only{display:none}</style><script src="milky-way.js" defer></script></head><body><div id="milky-way-ascii">
  <canvas role="img" aria-label="Animated ASCII Milky Way derived from the supplied photograph, with drifting star clouds, dark dust lanes, adjustable angle and background, twinkling stars and distant galaxies.">Animated ASCII Milky Way.</canvas>
  <div class="viz-controls">
    <label class="form-label">Angle <output id="space-angle-value">0°</output><input id="space-angle" class="form-range" type="range" min="-180" max="180" step="1" value="0"></label>
    <label class="form-label">Background <output id="space-colour-value">#25303b</output><input id="space-colour" class="form-control form-control-color" type="color" value="#25303b"></label>
  </div>
  <div class="viz-controls">
    <label class="form-label">Colour vividness · <output id="space-vividness-value">55%</output> · Muted to vivid<input id="space-vividness" class="form-range" type="range" min="0" max="100" step="1" value="55"></label>
  </div>
  <div class="viz-row">
    <label class="form-check"><input id="space-stars" class="form-check-input" type="checkbox" checked><span class="form-check-label">Shining stars</span></label>
    <label class="form-check"><input id="space-galaxies" class="form-check-input" type="checkbox" checked><span class="form-check-label">Shining galaxies</span></label>
    <button type="button" class="btn" id="space-play">Pause</button>
  </div>
  <div class="viz-controls">
    <label class="form-label">Rendering<select class="form-select" id="space-style"><option value="tiles">Colour cells</option><option value="ascii">Characters only</option></select></label>
    <label class="form-label">Detail<select class="form-select" id="space-detail"><option value="128" selected>Bold</option><option value="176">Balanced</option><option value="240">Fine</option></select></label>
  </div>
  <span class="sr-only" id="space-status" aria-live="polite"></span>
</div>
</body></html>
